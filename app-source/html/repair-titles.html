<!doctype html>
<html lang="">
	<head>
		<meta charset="utf-8" />
		<title>Nextcloud Bookmark Manager - Repair Titles</title>
		<script>
			require( '../js/theme.min' )
		</script>
		<link rel="stylesheet" type="text/css" href="../css/modal.min.css" media="all">
		<style>
			/* Add padding so content isn't flush with window edges */
			#repair-wrap { padding: 16px 30px 0; }
			#repair-wrap li { padding-bottom: 0; }
			#repair-wrap label {
				float: none !important;
				display: block !important;
				width: auto !important;
				text-align: left !important;
				padding-right: 0 !important;
				font-size: 12px !important;
				line-height: 1.4 !important;
				font-weight: 600;
				margin-bottom: 4px;
			}
			#repair-wrap label::after { content: none !important; }
			
			.progress-container { margin: 16px 0; }
			.progress-bar {
				width: 100%; height: 8px; border-radius: 4px;
				background: var(--tab-dividers); overflow: hidden;
			}
			.progress-fill {
				height: 100%; width: 0%; border-radius: 4px;
				background: var(--accent); transition: width .3s ease;
			}
			.progress-text { font-size: 12px; color: var(--text); margin-top: 6px; opacity: .7; }
			
			.section { margin-bottom: 14px; }
			.section-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
			.section-value { font-size: 13px; color: var(--text); margin-bottom: 2px; }
			
			.scope-row {
				display: flex !important;
				align-items: center;
				gap: 6px;
				cursor: pointer;
				margin-bottom: 4px;
			}
			.scope-row input { margin: 0; flex: none; }
			
			.hint {
				font-size: 11px;
				color: var(--text);
				opacity: .65;
				line-height: 1.45;
				margin: 4px 0 8px;
			}
			
			#results-list { max-height: 300px; overflow-y: auto; margin: 10px 0; }
			.result-item {
				padding: 8px 10px; margin-bottom: 4px; border-radius: 4px;
				background: var(--stripe-even); border: 1px solid var(--tab-dividers);
				font-size: 12px; line-height: 1.4;
			}
			.result-item .toggle-line {
				display: flex !important;
				align-items: flex-start;
				gap: 8px;
				cursor: pointer;
				margin: 0 !important;
			}
			.result-item .toggle-line input { margin-top: 3px; flex: none; }
			.result-item .titles { flex: 1 1 auto; min-width: 0; }
			.result-item .old-title {
				color: var(--text); opacity: .6;
				text-decoration: line-through;
				white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			}
			.result-item .new-title {
				color: var(--text); font-weight: 600;
				white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
			}
			.result-item .arrow { opacity: .5; margin: 1px 0; font-size: 11px; }
			.result-item .muted { opacity: .45; font-style: italic; font-weight: 400; }
			.result-item .field-label {
				font-size: 10px; font-weight: 700; text-transform: uppercase;
				opacity: .55; letter-spacing: .04em; margin: 6px 0 2px;
			}
			.result-item.unrecoverable { opacity: .65; }
			.badge {
				display: inline-block; padding: 1px 6px; border-radius: 3px;
				font-size: 10px; font-weight: 600; flex: none; margin-top: 2px;
			}
			.badge-local { background: var(--accent-light); color: #fff; }
			.badge-web { background: var(--accent); color: #fff; }
			.badge-both { background: var(--accent); color: #fff; }
			.badge-x { background: var(--tab-dividers); color: var(--text); }
			.badge-approx { background: var(--accent-gold, #d97706); color: #fff; }
			
			.summary-stats {
				font-size: 12px; color: var(--text); padding: 8px 10px;
				background: var(--stripe-even); border-radius: 4px; margin: 8px 0;
				line-height: 1.5;
			}
			.summary-stats strong { font-weight: 600; }
			
			.scroll { display: flex; flex-direction: column; overflow: hidden; }
			#repair-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
			footer {
				display: grid;
				grid-template-columns: 1fr auto 1fr;
				align-items: center;
				gap: 8px;
				padding: 10px 0;
				border-top: 1px solid var(--tab-dividers);
				margin-top: 6px;
				flex-shrink: 0;
			}
			footer .left,
			footer .right {
				float: none;
				display: flex;
				gap: 8px;
				align-items: center;
			}
			footer .left { justify-self: start; }
			footer .right { justify-self: end; }
			.action-status {
				font-size: 11px;
				color: var(--text);
				opacity: .7;
				line-height: 1.3;
				max-width: 320px;
				text-align: center;
				justify-self: center;
			}
			.ui-button.done {
				box-shadow: inset 0 0 0 1.5px var(--accent);
				color: var(--accent);
			}
		</style>
	</head>
	
	<body>
		<header data-i18n="repairtitles:header">Repair Titles</header>
		
		<div class="scroll">
			<div id="repair-wrap">
				
				<!-- Step 1: Scope & Start -->
				<div id="step-start" class="section">
					<ul>
						<li style="padding-bottom:6px;">
							<div class="section-title" data-i18n="repairtitles:label.scope">Scope</div>
							<label for="scope-selected" id="scope-selected-label" class="scope-row">
								<input type="radio" name="scope" id="scope-selected" checked>
								<span data-i18n="repairtitles:scope.selected">Only selected bookmarks</span> (<span id="cfg-selected">0</span>)
							</label>
							<label for="scope-all" class="scope-row">
								<input type="radio" name="scope" id="scope-all">
								<span data-i18n="repairtitles:scope.all">All bookmarks</span> (<span id="cfg-total">0</span>)
							</label>
							<div class="hint" data-i18n="repairtitles:label.what">Repairs titles and descriptions corrupted by a bad encoding: first locally, then by fetching the real title from the page when needed.</div>
						</li>
						<li style="padding-bottom:6px;">
							<label for="chk-fill-desc" class="scope-row" style="font-weight:400;">
								<input type="checkbox" id="chk-fill-desc" style="margin:0;flex:none;">
								<span data-i18n="repairtitles:label.fill_desc">Fill empty descriptions from the page</span>
							</label>
							<div class="hint" data-i18n="repairtitles:hint.fill_desc">For bookmarks without a description, fetch the page's meta description. Many web requests — can take a while.</div>
						</li>
					</ul>
				</div>
				
				<!-- Step 2: Progress -->
				<div id="step-progress" class="section" style="display:none;">
					<div class="progress-container">
						<div class="progress-bar">
							<div class="progress-fill" id="progress-fill"></div>
						</div>
						<div class="progress-text" id="progress-text"></div>
					</div>
				</div>
				
				<!-- Step 3: Results Review -->
				<div id="step-results" class="section" style="display:none;">
					<div class="summary-stats" id="summary-stats"></div>
					<div id="results-list"></div>
				</div>
				
			</div>
			
			<footer>
				<span class="left">
					<button id="btn-start" class="ui-button" type="button" data-i18n="repairtitles:button.start">Scan</button>
				</span>
				<span id="action-status" class="action-status"></span>
				<span class="right">
					<button id="btn-apply" class="ui-button" type="button" data-i18n="repairtitles:button.apply" style="display:none;">Apply to Server</button>
					<button id="btn-close" class="ui-button" type="button" data-i18n="repairtitles:button.close">Close</button>
				</span>
			</footer>
		</div>
		
		<script>
			require( '../js/modal-repair-titles.min' )
		</script>
	</body>
</html>
